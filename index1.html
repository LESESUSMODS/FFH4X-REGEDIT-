<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFH4X REGEDIT | High Performance</title>
    <style>
        :root {
            --main-red: #ff003c;
            --dark-red: #80001d;
            --bg-black: #0a0a0a;
        }
        body {
            background-color: var(--bg-black);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        .card {
            background: #111;
            width: 340px;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #222;
            border-top: 5px solid var(--main-red);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            text-align: center;
        }
        h2 { 
            color: var(--main-red); 
            letter-spacing: 2px; 
            margin-bottom: 5px; 
            font-size: 24px;
        }
        .status-text { color: #555; font-size: 12px; margin-bottom: 30px; display: block; }
        
        .mod-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .mod-row:hover { border: 1px solid var(--main-red); }
        
        .label { font-size: 15px; display: flex; flex-direction: column; text-align: left; }
        .value { font-size: 11px; color: var(--main-red); font-weight: bold; }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px; height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .3s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px;
            left: 4px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--main-red); }
        input:checked + .slider:before { transform: translateX(20px); }

        .btn-inject {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, var(--dark-red), var(--main-red));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255,0,60,0.3);
        }
        .btn-inject:hover { transform: translateY(-2px); box-shadow: 0 10px 25px var(--main-red); }
        .btn-inject:disabled { background: #333; box-shadow: none; cursor: not-allowed; }

        #log {
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            color: #666;
            min-height: 18px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">
        <h2 style="font-family: 'Orbitron', sans-serif;">FFH4X REGEDIT</h2>
        <span class="status-text">แอพดูดหัว FFH4X V1</span>

        <div class="mod-row">
            <div class="label">
                <span>ดูดหัว</span>
                <span class="value">ดูดหัว: 80%</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="shot_80">
                <span class="slider"></span>
            </label>
        </div>

        <div class="mod-row">
            <div class="label">
                <span>ช่วยลาก</span>
                <span class="value">ช่วยลาก: 90%</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="drag_90">
                <span class="slider"></span>
            </label>
        </div>

        <button id="btn" class="btn-inject" onclick="inject()">ENABLE REGISTRAR</button>
        <div id="log">Sytem Ready</div>
    </div>

    <script>
        async function inject() {
            const log = document.getElementById('log');
            const btn = document.getElementById('btn');
            const isShot = document.getElementById('shot_80').checked;
            const isDrag = document.getElementById('drag_90').checked;

            if (!isShot && !isDrag) {
                log.innerText = "ERROR: NO MODULE SELECTED";
                log.style.color = "red";
                return;
            }

            btn.disabled = true;
            btn.innerText = "PROCESSING...";
            log.style.color = "#aaa";

            // จำลองขั้นตอนการฉีดค่า
            await wait(600);
            log.innerText = "Offsetting Registers 0x..";
            await wait(800);
            log.innerText = "Partnering with FF Datastream...";
            
            // การผูกค่าลงใน Memory (LocalStorage)
            const inj_data = {
                shot_accuracy: isShot ? 80 : 0,
                drag_helper: isDrag ? 90 : 0,
                auth_user: "Premium_User_Unlocked",
                game_supported: "Free Fire & FF MAX",
                state: "ACTIVE"
            };
            localStorage.setItem("FFH4X_DATA", JSON.stringify(inj_data));

            await wait(1000);
            log.innerText = "Writing Memory...";
            await wait(800);
            
            log.style.color = "#00ffaa";
            log.innerText = "INJECTION COMPLETED SUCCESSFULLY";
            btn.innerText = "DATA INJECTED";
            btn.style.background = "#00ffaa";
            btn.style.color = "#000";

            alert("FFH4X REGEDIT: ค่าถูกฉีดเข้าเป็น 80% และ 90% แล้ว (FF & FF MAX)");
        }

        function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    </script>
</body>
</html>
